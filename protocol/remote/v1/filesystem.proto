syntax = "proto3";

package agentkit.remote.v1;

import "google/protobuf/timestamp.proto";

message ReadRequest {
  string target_id = 1;
  string path = 2;
  int64 offset = 3;
  uint32 length = 4;
}

message ReadResponse {
  bytes data = 1;
  bool eof = 2;
}

message WriteRequest {
  string target_id = 1;
  string path = 2;
  optional bytes data = 3;
}

message WriteResponse {
  uint64 bytes_written = 1;
}

message ReadDirRequest {
  string target_id = 1;
  string path = 2;
}

message ReadDirResponse {
  repeated DirectoryEntry entries = 1;
}

message DirectoryEntry {
  string name = 1;
  FileType type = 2;
}

message StatRequest {
  string target_id = 1;
  string path = 2;
  bool follow_symlinks = 3;
}

message StatResponse {
  FileInfo info = 1;
}

message FileInfo {
  FileType type = 1;
  int64 size = 2;
  google.protobuf.Timestamp modified_at = 3;
}

message MkdirRequest {
  string target_id = 1;
  string path = 2;
  bool recursive = 3;
}

message MkdirResponse {}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_FILE = 1;
  FILE_TYPE_DIRECTORY = 2;
  FILE_TYPE_SYMLINK = 3;
  FILE_TYPE_OTHER = 4;
}

message FileErrorDetail {
  string reason = 1;
  MutationState mutation_state = 2;
}

enum MutationState {
  MUTATION_STATE_UNSPECIFIED = 0;
  MUTATION_STATE_NOT_STARTED = 1;
  MUTATION_STATE_MAY_HAVE_CHANGED = 2;
}

message FilesystemLimits {
  uint32 max_read_chunk_bytes = 1;
  uint64 max_write_bytes = 2;
  uint32 max_directory_entries = 3;
  uint64 max_directory_response_bytes = 4;
  uint32 max_concurrent_session_requests = 5;
  uint32 max_concurrent_global_requests = 6;
  uint32 max_path_bytes = 7;
}
